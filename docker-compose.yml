version: '3.8'

services:
  aegistrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegistrap-honeypot
    restart: unless-stopped
    ports:
      - "8080:8080"   # WebSocket / Control API
      - "8081:8081"   # HTTP Honeypot Trap
      - "2121:2121"   # FTP Honeypot Trap
      - "2222:2222"   # SSH Honeypot Trap
      - "5173:5173"   # AegisTrap Dashboard UI
    environment:
      - NODE_ENV=production
